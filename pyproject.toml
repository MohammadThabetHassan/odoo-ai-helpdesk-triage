[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["docs/eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Odoo package __init__.py files import submodules for side-effect registration;
# ruff cannot see those as "used".
"__init__.py" = ["F401"]

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = "docs/eval"
